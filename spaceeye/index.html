<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#080d19"><title>Spaceeye</title><style>
*{box-sizing:border-box}[hidden]{display:none!important}html,body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none}body{background:#080d19;color:#e9f2ff;font-family:system-ui,sans-serif;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
main{height:100vh;height:100dvh;max-width:560px;margin:auto;display:flex;flex-direction:column;gap:8px;padding:max(8px,env(safe-area-inset-top)) max(10px,env(safe-area-inset-right)) max(10px,env(safe-area-inset-bottom)) max(10px,env(safe-area-inset-left))}
.hud,.stage,.deck{user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.bar{display:flex;align-items:center;gap:10px;font-size:13px}#identity{font-weight:700;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.status{font-size:11px;color:#95a7be;white-space:nowrap}
.hull{flex:1;font:11px monospace;color:#70e7da}.hull meter{display:block;width:100%;height:8px;margin-top:3px;accent-color:#70e7da}
.pilots{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:8px}.pilot{display:flex;flex-direction:column;gap:2px;background:#0e1523;border:1px solid #253044;border-radius:8px;padding:5px 7px;font:10px monospace;white-space:nowrap;overflow:hidden}.pilot small{display:none}.dot{display:inline-block;width:7px;height:7px;border-radius:100%;margin-right:5px}
.stage{flex:1;min-height:0;display:grid;place-items:center;container-type:size}.arena{display:block;width:min(100cqw,100cqh);height:min(100cqw,100cqh);touch-action:none}
#message{margin:0;min-height:16px;font-size:12px;color:#91a4bd;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
button{font:inherit;cursor:pointer;border:0;border-radius:10px;font-weight:700;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}button *{pointer-events:none}button:disabled{opacity:.45;cursor:default}
.primary{width:100%;min-height:58px;background:#70e7da;color:#07131c;font-size:17px}.leave{background:#1e293c;color:#dbe7fa;padding:7px 11px;font-size:12px}
.controls,.arsenal{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.arsenal{margin-top:8px}.controls button,.arsenal button{min-height:54px;background:#1d2b40;color:#e9f2ff;padding:6px 4px}.controls button{font-size:22px}.arsenal button{font-size:13px;line-height:1.15}.arsenal button small{display:block;margin-top:3px;font:10px monospace;color:#91a4bd}.controls button.active,.arsenal button.active{background:#70e7da;color:#07131c}.arsenal button[data-action="photon"]{border:1px solid #bc9cff66}.arsenal button[data-action="warp"]{border:1px solid #70e7da66}
:focus-visible{outline:3px solid white;outline-offset:2px}
@media(orientation:landscape) and (max-height:560px){main{max-width:none;display:grid;grid-template-columns:1fr minmax(260px,340px);grid-template-rows:auto 1fr auto auto;column-gap:14px;row-gap:6px}.hud{grid-column:2}.stage{grid-column:1;grid-row:1/-1}#message{grid-column:2;text-align:left}.deck{grid-column:2}}
</style></head><body><main><div class="hud"><div class="bar"><span id="identity">Spectating</span><span class="status" id="network" role="status">Connecting…</span><button class="leave" id="leave" hidden>Leave</button></div><div class="bar hull" id="hull" hidden><span style="flex:1"><span id="hull-label"></span><meter id="hull-meter" min="0" max="100" value="100" aria-label="Ship hull"></meter></span></div><div class="pilots" id="pilots"></div></div><div class="stage"><canvas class="arena" id="arena" width="800" height="800" aria-label="Live shared space arena with up to four ships"></canvas></div><p id="message" role="status"></p><div class="deck"><button class="primary" id="join" disabled>Take a ship</button><div id="flight" hidden><div class="controls"><button aria-label="Turn left" data-control="left">↶</button><button aria-label="Thrust" data-control="thrust">↑</button><button aria-label="Turn right" data-control="right">↷</button><button aria-label="Brake" data-control="brake">■</button></div><div class="arsenal"><button data-control="gun" aria-label="Fire guns" disabled>Guns<small>HOLD</small></button><button data-action="missile" aria-label="Launch missile" disabled>Missile<small id="cd-missile">READY</small></button><button data-action="photon" aria-label="Fire photon torpedo" disabled>Photon<small id="cd-photon">READY</small></button><button data-action="warp" aria-label="Activate warp drive" disabled>Warp<small id="cd-warp">READY</small></button></div></div></div></main><script>
const $ = id => document.getElementById(id);
const colors = ['#70e7da', '#fbb969', '#bc9cff', '#ff789a'], names = ['Comet', 'Nova', 'Orbit', 'Pulsar'];
let ws, slot = null, ships = [], projectiles = [], effects = [], connected = false;
let stateAt = 0, lcdAt = 0, serverNow = 0, retry = 500, feedback = '', feedbackUntil = 0;
const input = { left: false, right: false, thrust: false, brake: false, gun: false }, held = new Set();
function send(value) { if (ws?.readyState === 1) ws.send(JSON.stringify(value)); }
function clearControls() {
  held.clear(); for (const k in input) input[k] = false;
  document.querySelectorAll('[data-control]').forEach(b => b.classList.remove('active'));
  send({ type: 'input', ...input });
}
function ui() {
  const me = ships.find(s => s.slot === slot), age = Date.now() - stateAt, humans = ships.filter(s => !s.bot).length;
  $('network').textContent = connected ? '● Online' : '○ Reconnecting…';
  $('join').disabled = !connected || humans >= 4;
  $('join').hidden = slot !== null; $('leave').hidden = slot === null; $('flight').hidden = slot === null;
  $('identity').textContent = slot === null ? 'Spectating' : names[slot] + ' · Pilot ' + (slot + 1);
  $('identity').style.color = slot === null ? '' : colors[slot];
  $('message').textContent = slot === null
    ? (humans >= 4 ? 'All ships taken. Waiting for a seat.' : humans < ships.length ? 'Join to take over an AI ship.' : '')
    : (me?.hp === 0 ? 'Ship destroyed. Respawning in ' + (Math.max(0, me.respawnMs - age) / 1000).toFixed(1) + 's…'
      : Date.now() < feedbackUntil ? feedback : '');
  $('hull').hidden = slot === null;
  $('hull-label').textContent = 'HULL ' + (me?.hp ?? 100) + '% · ' + (me?.kills ?? 0) + ' KILLS';
  $('hull-meter').value = me?.hp ?? 100;
  $('pilots').innerHTML = names.map((n, i) => {
    const s = ships.find(s => s.slot === i);
    return '<div class="pilot"><span><i class="dot" style="background:' + colors[i] + '"></i>' + n + '</span><span>'
      + (s ? (slot === i ? 'YOU · ' : s.bot ? 'AI · ' : '') + s.hp + '%<small>' + s.kills + ' kills' + (s.hp === 0 ? ' · respawning' : '') + '</small>' : 'OPEN SEAT') + '</span></div>';
  }).join('');
  document.querySelectorAll('[data-control]').forEach(b => b.disabled = !connected || slot === null || me?.hp === 0);
  document.querySelectorAll('[data-action]').forEach(b => {
    const action = b.dataset.action, remaining = Math.max(0, (me?.cooldowns?.[action] ?? 0) - age);
    b.disabled = !connected || slot === null || !me || me.hp === 0 || remaining > 0;
    $('cd-' + action).textContent = remaining > 0 ? (remaining / 1000).toFixed(1) + 's' : 'READY';
  });
}
function connect() {
  ws = new WebSocket((location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + '/ws');
  ws.onopen = () => { connected = true; retry = 500; ui(); };
  ws.onmessage = e => {
    const m = JSON.parse(e.data);
    if (m.type === 'welcome' || m.type === 'joined') { slot = m.slot; ui(); }
    if (m.type === 'state') { ships = m.ships; projectiles = m.projectiles || []; effects = m.effects || []; stateAt = Date.now(); serverNow = m.now; lcdAt = m.lcdAt; ui(); }
    if (m.type === 'action') {
      const labels = { gun: 'Guns fired', missile: 'Guided missile launched', photon: 'Photon torpedo launched', warp: 'Warp jump complete' };
      feedback = m.accepted ? labels[m.action] : 'Weapon recharging or ship unavailable'; feedbackUntil = Date.now() + 1400; ui();
    }
    if (m.type === 'error') { feedback = m.message; feedbackUntil = Date.now() + 1400; $('message').textContent = m.message; }
  };
  ws.onclose = () => { connected = false; slot = null; clearControls(); ui(); setTimeout(connect, retry); retry = Math.min(8000, retry * 2); };
  ws.onerror = () => ws.close();
}
$('join').onclick = () => send({ type: 'join' });
$('leave').onclick = () => { clearControls(); send({ type: 'leave' }); slot = null; ui(); };
const keyMap = { ArrowLeft: 'left', a: 'left', ArrowRight: 'right', d: 'right', ArrowUp: 'thrust', w: 'thrust', ArrowDown: 'brake', s: 'brake', ' ': 'gun' };
const actions = { m: 'missile', t: 'photon', Shift: 'warp' };
function update() {
  for (const k in input) input[k] = [...held].some(v => keyMap[v] === k || v === k);
  document.querySelectorAll('[data-control]').forEach(b => b.classList.toggle('active', input[b.dataset.control]));
  if (slot !== null) send({ type: 'input', ...input });
}
window.onkeydown = e => {
  const key = e.key.length === 1 ? e.key.toLowerCase() : e.key;
  if (slot === null || (!keyMap[key] && !actions[key])) return;
  e.preventDefault();
  if (actions[key]) { if (!e.repeat) send({ type: 'action', action: actions[key] }); }
  else { held.add(key); update(); }
};
window.onkeyup = e => { held.delete(e.key.length === 1 ? e.key.toLowerCase() : e.key); update(); };
window.onblur = clearControls;
document.addEventListener('visibilitychange', () => { if (document.hidden) clearControls(); });
document.querySelectorAll('[data-control]').forEach(b => {
  b.onpointerdown = e => { e.preventDefault(); if (b.disabled) return; b.setPointerCapture(e.pointerId); held.add(b.dataset.control); update(); };
  b.onpointerup = b.onpointercancel = b.onlostpointercapture = () => { held.delete(b.dataset.control); update(); };
});
document.querySelectorAll('[data-action]').forEach(b => b.onclick = () => send({ type: 'action', action: b.dataset.action }));
document.querySelectorAll('button').forEach(b => b.oncontextmenu = e => e.preventDefault());
setInterval(() => { if (connected && slot !== null) send({ type: 'input', ...input }); }, 50);
setInterval(() => { if (connected) send({ type: 'ping' }); }, 2000);
setInterval(ui, 100);
const c = $('arena').getContext('2d');
const stars = Array.from({ length: 95 }, (_, i) => ({ x: (i * 73 + 17) % 800, y: (i * 137 + 41) % 800, r: i % 5 === 0 ? 2 : 1 }));
function draw(t) {
  c.clearRect(0, 0, 800, 800); c.save(); c.beginPath(); c.arc(400, 400, 365, 0, Math.PI * 2); c.clip();
  const g = c.createRadialGradient(360, 320, 0, 400, 400, 400);
  g.addColorStop(0, '#152a3d'); g.addColorStop(.6, '#0d182b'); g.addColorStop(1, '#070d19'); c.fillStyle = g; c.fillRect(0, 0, 800, 800);
  for (const s of stars) { c.globalAlpha = .3 + .4 * (1 + Math.sin(t * .0006 + s.x)) * .5; c.fillStyle = '#c4e7ff'; c.beginPath(); c.arc(s.x, s.y, s.r, 0, 7); c.fill(); }
  c.globalAlpha = 1; c.strokeStyle = '#23364b'; c.lineWidth = 1;
  for (const r of [115, 230, 325]) { c.beginPath(); c.arc(400, 400, r, 0, 7); c.stroke(); }
  c.setLineDash([3, 10]); c.beginPath(); c.moveTo(400, 30); c.lineTo(400, 770); c.moveTo(30, 400); c.lineTo(770, 400); c.stroke(); c.setLineDash([]);
  c.fillStyle = '#263d52'; c.beginPath(); c.arc(400, 400, 12, 0, 7); c.fill();
  const now = serverNow + Date.now() - stateAt, age = Math.min(.12, (Date.now() - stateAt) / 1000);
  for (const e of effects) {
    const life = Math.max(0, Math.min(1, (now - e.born) / 1000));
    if (life >= 1) continue;
    c.globalAlpha = 1 - life; c.strokeStyle = e.kind === 2 ? '#70e7da' : e.kind === 3 ? '#d2acff' : '#ffb36b';
    c.lineWidth = e.kind === 2 ? 3 : 2; c.beginPath(); c.arc(e.x * 5, e.y * 5, 5 + life * (e.kind === 3 ? 90 : 50), 0, 7); c.stroke();
    if (e.kind !== 2) { c.fillStyle = c.strokeStyle; for (let i = 0; i < 8; i++) { const a = i * Math.PI / 4; c.fillRect(e.x * 5 + Math.cos(a) * life * 55, e.y * 5 + Math.sin(a) * life * 55, 3, 3); } }
  }
  c.globalAlpha = 1;
  for (const p of projectiles) {
    c.save(); c.translate(p.x * 5, p.y * 5); c.rotate(p.a);
    c.strokeStyle = p.kind === 2 ? '#bc9cff' : p.kind === 1 ? '#fbb969' : colors[p.owner];
    c.fillStyle = c.strokeStyle; c.shadowColor = c.strokeStyle; c.shadowBlur = p.kind === 2 ? 25 : 10;
    if (p.kind === 0) { c.lineWidth = 3; c.beginPath(); c.moveTo(-8, 0); c.lineTo(4, 0); c.stroke(); }
    if (p.kind === 1) { c.beginPath(); c.moveTo(7, 0); c.lineTo(-5, -3); c.lineTo(-5, 3); c.closePath(); c.fill(); c.fillStyle = '#fff2ac'; c.fillRect(-11, -1, 6, 2); }
    if (p.kind === 2) { c.beginPath(); c.arc(0, 0, 8, 0, 7); c.fill(); c.fillStyle = 'white'; c.beginPath(); c.arc(0, 0, 3, 0, 7); c.fill(); }
    c.restore();
  }
  for (const s of ships) {
    if (s.hp === 0) continue;
    c.save(); c.translate((s.x + s.vx * age) * 5, (s.y + s.vy * age) * 5);
    if (s.shield || s.warp) { c.strokeStyle = colors[s.slot]; c.globalAlpha = .45 + .2 * Math.sin(t * .01); c.lineWidth = 2; c.beginPath(); c.arc(0, 0, s.warp ? 32 : 26, 0, 7); c.stroke(); c.globalAlpha = 1; }
    c.rotate(s.a);
    if (s.thrust) { c.fillStyle = colors[s.slot]; c.globalAlpha = .7; c.beginPath(); c.moveTo(-12, -6); c.lineTo(-28 - Math.random() * 12, 0); c.lineTo(-12, 6); c.fill(); c.globalAlpha = 1; }
    c.shadowColor = colors[s.slot]; c.shadowBlur = 22; c.fillStyle = s.hit ? '#ffffff' : colors[s.slot];
    c.beginPath(); c.moveTo(20, 0); c.lineTo(-13, -11); c.lineTo(-7, 0); c.lineTo(-13, 11); c.closePath(); c.fill();
    c.shadowBlur = 0; c.fillStyle = '#f7ffff'; c.beginPath(); c.arc(1, 0, 3, 0, 7); c.fill(); c.restore();
    c.fillStyle = colors[s.slot]; c.font = '12px monospace'; c.textAlign = 'center';
    c.fillText(names[s.slot].toUpperCase() + (slot === s.slot ? ' / YOU' : s.bot ? ' / AI' : ''), s.x * 5, s.y * 5 + 33);
    c.fillStyle = '#27394d'; c.fillRect(s.x * 5 - 17, s.y * 5 + 39, 34, 3);
    c.fillStyle = s.hp > 30 ? colors[s.slot] : '#ff789a'; c.fillRect(s.x * 5 - 17, s.y * 5 + 39, 34 * s.hp / 100, 3);
  }
  if (!ships.length) { c.textAlign = 'center'; c.fillStyle = '#91a4bd'; c.font = '14px monospace'; c.fillText('AWAITING PILOTS', 400, 510); }
  c.restore(); c.strokeStyle = '#39536e'; c.lineWidth = 2; c.beginPath(); c.arc(400, 400, 365, 0, 7); c.stroke(); requestAnimationFrame(draw);
}
ui(); connect(); requestAnimationFrame(draw);
</script></body></html>
